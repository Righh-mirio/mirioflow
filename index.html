<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirioflow</title>
    <!-- Apply the saved theme before the first paint (no flash). Keep in sync
         with src/lib/theme.ts; theme.test.ts runs this script. -->
    <script id="theme-init">
      (function () {
        var preference = "system";
        try {
          var stored = window.localStorage.getItem("gladiaflow.theme");
          if (stored === "light" || stored === "dark") preference = stored;
        } catch (error) {}
        var prefersDark = true;
        try {
          prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
        } catch (error) {}
        document.documentElement.dataset.theme =
          preference === "system"
            ? prefersDark
              ? "dark"
              : "light"
            : preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
